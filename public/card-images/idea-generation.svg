<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a365d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#163157" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Abstract shapes representing ideas -->
  <g opacity="0.8">
    <!-- Central light bulb -->
    <circle cx="400" cy="250" r="80" fill="url(#glowGradient)" opacity="0.6"/>
    <path d="M400 150 Q400 190 400 230 Q400 270 430 300 Q460 330 430 350 Q400 370 370 350 Q340 330 370 300 Q400 270 400 230" 
          stroke="#93c5fd" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M385 350 L385 380 Q385 390 400 390 Q415 390 415 380 L415 350" 
          stroke="#93c5fd" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M385 385 L415 385" stroke="#93c5fd" stroke-width="4" fill="none"/>
    
    <!-- Idea nodes -->
    <circle cx="280" cy="180" r="15" fill="#3b82f6" opacity="0.7"/>
    <circle cx="520" cy="180" r="15" fill="#3b82f6" opacity="0.7"/>
    <circle cx="220" cy="300" r="15" fill="#3b82f6" opacity="0.7"/>
    <circle cx="580" cy="300" r="15" fill="#3b82f6" opacity="0.7"/>
    <circle cx="330" cy="420" r="15" fill="#3b82f6" opacity="0.7"/>
    <circle cx="470" cy="420" r="15" fill="#3b82f6" opacity="0.7"/>
    
    <!-- Connection lines -->
    <line x1="400" y1="250" x2="280" y2="180" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
    <line x1="400" y1="250" x2="520" y2="180" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
    <line x1="400" y1="250" x2="220" y2="300" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
    <line x1="400" y1="250" x2="580" y2="300" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
    <line x1="400" y1="250" x2="330" y2="420" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
    <line x1="400" y1="250" x2="470" y2="420" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
    
    <!-- Secondary connections -->
    <line x1="280" y1="180" x2="220" y2="300" stroke="#93c5fd" stroke-width="1" opacity="0.3"/>
    <line x1="520" y1="180" x2="580" y2="300" stroke="#93c5fd" stroke-width="1" opacity="0.3"/>
    <line x1="220" y1="300" x2="330" y2="420" stroke="#93c5fd" stroke-width="1" opacity="0.3"/>
    <line x1="580" y1="300" x2="470" y2="420" stroke="#93c5fd" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Particles -->
  <g opacity="0.7">
    <circle cx="150" cy="100" r="3" fill="#93c5fd"/>
    <circle cx="650" cy="150" r="2" fill="#93c5fd"/>
    <circle cx="200" cy="450" r="2" fill="#93c5fd"/>
    <circle cx="600" cy="400" r="3" fill="#93c5fd"/>
    <circle cx="350" cy="100" r="2" fill="#93c5fd"/>
    <circle cx="450" cy="500" r="2" fill="#93c5fd"/>
    <circle cx="700" cy="300" r="3" fill="#93c5fd"/>
    <circle cx="100" cy="350" r="3" fill="#93c5fd"/>
  </g>
</svg> 