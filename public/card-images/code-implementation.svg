<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a202e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Code Editor Interface -->
  <g opacity="0.9">
    <!-- Editor Window -->
    <rect x="180" y="120" width="440" height="360" rx="8" ry="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Window Header -->
    <rect x="180" y="120" width="440" height="30" rx="8" ry="8" fill="#334155"/>
    <circle cx="200" cy="135" r="6" fill="#ef4444"/>
    <circle cx="220" cy="135" r="6" fill="#eab308"/>
    <circle cx="240" cy="135" r="6" fill="#22c55e"/>
    
    <!-- Editor Content -->
    <rect x="180" y="150" width="440" height="330" fill="#0f172a"/>
    
    <!-- Line Numbers -->
    <text x="200" y="180" font-family="monospace" font-size="12" fill="#64748b">1</text>
    <text x="200" y="205" font-family="monospace" font-size="12" fill="#64748b">2</text>
    <text x="200" y="230" font-family="monospace" font-size="12" fill="#64748b">3</text>
    <text x="200" y="255" font-family="monospace" font-size="12" fill="#64748b">4</text>
    <text x="200" y="280" font-family="monospace" font-size="12" fill="#64748b">5</text>
    <text x="200" y="305" font-family="monospace" font-size="12" fill="#64748b">6</text>
    <text x="200" y="330" font-family="monospace" font-size="12" fill="#64748b">7</text>
    <text x="200" y="355" font-family="monospace" font-size="12" fill="#64748b">8</text>
    <text x="200" y="380" font-family="monospace" font-size="12" fill="#64748b">9</text>
    <text x="195" y="405" font-family="monospace" font-size="12" fill="#64748b">10</text>
    <text x="195" y="430" font-family="monospace" font-size="12" fill="#64748b">11</text>
    <text x="195" y="455" font-family="monospace" font-size="12" fill="#64748b">12</text>
    
    <!-- Code Text -->
    <text x="225" y="180" font-family="monospace" font-size="12" fill="#c084fc" opacity="0.9">import</text>
    <text x="270" y="180" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">numpy</text>
    <text x="315" y="180" font-family="monospace" font-size="12" fill="#c084fc" opacity="0.9">as</text>
    <text x="335" y="180" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">np</text>
    
    <text x="225" y="205" font-family="monospace" font-size="12" fill="#c084fc" opacity="0.9">import</text>
    <text x="270" y="205" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">tensorflow</text>
    <text x="345" y="205" font-family="monospace" font-size="12" fill="#c084fc" opacity="0.9">as</text>
    <text x="365" y="205" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">tf</text>
    
    <text x="225" y="230" font-family="monospace" font-size="12" fill="#94a3b8" opacity="0.9"># Define the neural network model</text>
    
    <text x="225" y="255" font-family="monospace" font-size="12" fill="#c084fc" opacity="0.9">def</text>
    <text x="250" y="255" font-family="monospace" font-size="12" fill="#38bdf8" opacity="0.9">create_model</text>
    <text x="330" y="255" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">(input_shape):</text>
    
    <text x="245" y="280" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">model = tf.keras.Sequential([</text>
    
    <text x="265" y="305" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">tf.keras.layers.Dense(128, activation='relu',</text>
    
    <text x="265" y="330" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">                          input_shape=input_shape),</text>
    
    <text x="265" y="355" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">tf.keras.layers.Dropout(0.2),</text>
    
    <text x="265" y="380" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">tf.keras.layers.Dense(10, activation='softmax')</text>
    
    <text x="245" y="405" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">])</text>
    
    <text x="245" y="430" font-family="monospace" font-size="12" fill="#c084fc" opacity="0.9">return</text>
    <text x="285" y="430" font-family="monospace" font-size="12" fill="#e2e8f0" opacity="0.9">model</text>
  </g>
  
  <!-- Abstract code elements -->
  <g opacity="0.5">
    <rect x="120" y="160" width="30" height="200" rx="2" ry="2" fill="#a78bfa" opacity="0.2"/>
    <rect x="650" y="240" width="30" height="200" rx="2" ry="2" fill="#a78bfa" opacity="0.2"/>
    <rect x="160" y="400" width="480" height="30" rx="2" ry="2" fill="#38bdf8" opacity="0.1"/>
    <rect x="160" y="80" width="480" height="30" rx="2" ry="2" fill="#38bdf8" opacity="0.1"/>
    
    <!-- Binary/code particles -->
    <text x="110" y="140" font-family="monospace" font-size="8" fill="#64748b" opacity="0.4">01001</text>
    <text x="680" y="200" font-family="monospace" font-size="8" fill="#64748b" opacity="0.4">10110</text>
    <text x="100" y="400" font-family="monospace" font-size="8" fill="#64748b" opacity="0.4">01101</text>
    <text x="690" y="460" font-family="monospace" font-size="8" fill="#64748b" opacity="0.4">10010</text>
    <text x="140" y="500" font-family="monospace" font-size="8" fill="#64748b" opacity="0.4">11001</text>
    <text x="680" y="120" font-family="monospace" font-size="8" fill="#64748b" opacity="0.4">00101</text>
  </g>
  
  <!-- Glowing cursor -->
  <rect x="285" y="430" width="6" height="14" fill="#38bdf8" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite" />
  </rect>
</svg> 