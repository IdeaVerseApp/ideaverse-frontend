<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="greenishGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="600" fill="url(#bgGradient)"/>
  
  <!-- Workflow Diagram with Connected Nodes -->
  <g>
    <!-- Connector Lines -->
    <path d="M400,150 L250,250 L250,350 L400,450 L550,350 L550,250 L400,150" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
    <line x1="250" y1="250" x2="550" y2="250" stroke="#64748b" stroke-width="2" opacity="0.3"/>
    <line x1="250" y1="350" x2="550" y2="350" stroke="#64748b" stroke-width="2" opacity="0.3"/>
    <line x1="400" y1="150" x2="400" y2="450" stroke="#64748b" stroke-width="2" opacity="0.3"/>
    
    <!-- Connection animation lines -->
    <circle cx="325" cy="200" r="4" fill="#10b981" opacity="0.6">
      <animate attributeName="cx" values="250;550;550;250;250" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;250;350;350;250" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="475" cy="300" r="4" fill="#3b82f6" opacity="0.6">
      <animate attributeName="cx" values="550;250;250;550;550" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="350;350;250;250;350" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="325" cy="400" r="4" fill="#8b5cf6" opacity="0.6">
      <animate attributeName="cx" values="400;250;550;400" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;350;350;150" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- User/Team Nodes -->
  <g>
    <!-- Idea Generation Node -->
    <circle cx="400" cy="150" r="40" fill="url(#purpleGradient)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="400" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle" alignment-baseline="middle">Ideas</text>
    <circle cx="400" cy="150" r="40" fill="none" stroke="#8b5cf6" stroke-width="1">
      <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Research Node 1 -->
    <circle cx="250" cy="250" r="40" fill="url(#blueGradient)" stroke="#3b82f6" stroke-width="2"/>
    <text x="250" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle" alignment-baseline="middle">Research</text>
    <circle cx="250" cy="250" r="40" fill="none" stroke="#3b82f6" stroke-width="1">
      <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    
    <!-- Code Node -->
    <circle cx="550" cy="250" r="40" fill="url(#greenishGradient)" stroke="#10b981" stroke-width="2"/>
    <text x="550" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle" alignment-baseline="middle">Code</text>
    <circle cx="550" cy="250" r="40" fill="none" stroke="#10b981" stroke-width="1">
      <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    
    <!-- Paper Node -->
    <circle cx="250" cy="350" r="40" fill="url(#blueGradient)" stroke="#3b82f6" stroke-width="2"/>
    <text x="250" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle" alignment-baseline="middle">Papers</text>
    <circle cx="250" cy="350" r="40" fill="none" stroke="#3b82f6" stroke-width="1">
      <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    
    <!-- Implementation Node -->
    <circle cx="550" cy="350" r="40" fill="url(#greenishGradient)" stroke="#10b981" stroke-width="2"/>
    <text x="550" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle" alignment-baseline="middle">Implement</text>
    <circle cx="550" cy="350" r="40" fill="none" stroke="#10b981" stroke-width="1">
      <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" begin="2s"/>
    </circle>
    
    <!-- Results Node -->
    <circle cx="400" cy="450" r="40" fill="url(#purpleGradient)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="400" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle" alignment-baseline="middle">Results</text>
    <circle cx="400" cy="450" r="40" fill="none" stroke="#8b5cf6" stroke-width="1">
      <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite" begin="2.5s"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" begin="2.5s"/>
    </circle>
  </g>
  
  <!-- User icons around the diagram -->
  <g opacity="0.9">
    <!-- User 1 -->
    <circle cx="180" cy="200" r="15" fill="#60a5fa" opacity="0.8"/>
    <circle cx="180" cy="180" r="8" fill="#60a5fa" opacity="0.9"/>
    <line x1="180" y1="205" x2="250" y2="250" stroke="#60a5fa" stroke-width="2" opacity="0.4"/>
    
    <!-- User 2 -->
    <circle cx="180" cy="400" r="15" fill="#10b981" opacity="0.8"/>
    <circle cx="180" cy="380" r="8" fill="#10b981" opacity="0.9"/>
    <line x1="180" y1="405" x2="250" y2="350" stroke="#10b981" stroke-width="2" opacity="0.4"/>
    
    <!-- User 3 -->
    <circle cx="620" cy="200" r="15" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="620" cy="180" r="8" fill="#8b5cf6" opacity="0.9"/>
    <line x1="620" y1="205" x2="550" y2="250" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
    
    <!-- User 4 -->
    <circle cx="620" cy="400" r="15" fill="#f97316" opacity="0.8"/>
    <circle cx="620" cy="380" r="8" fill="#f97316" opacity="0.9"/>
    <line x1="620" y1="405" x2="550" y2="350" stroke="#f97316" stroke-width="2" opacity="0.4"/>
    
    <!-- User 5 -->
    <circle cx="400" cy="100" r="15" fill="#ec4899" opacity="0.8"/>
    <circle cx="400" cy="80" r="8" fill="#ec4899" opacity="0.9"/>
    <line x1="400" y1="105" x2="400" y2="150" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
    
    <!-- User 6 -->
    <circle cx="400" cy="500" r="15" fill="#eab308" opacity="0.8"/>
    <circle cx="400" cy="480" r="8" fill="#eab308" opacity="0.9"/>
    <line x1="400" y1="505" x2="400" y2="450" stroke="#eab308" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Floating particles -->
  <g opacity="0.5">
    <circle cx="200" cy="150" r="2" fill="#60a5fa"/>
    <circle cx="600" cy="150" r="2" fill="#60a5fa"/>
    <circle cx="200" cy="450" r="2" fill="#60a5fa"/>
    <circle cx="600" cy="450" r="2" fill="#60a5fa"/>
    <circle cx="300" cy="300" r="2" fill="#60a5fa"/>
    <circle cx="500" cy="300" r="2" fill="#60a5fa"/>
  </g>
</svg> 